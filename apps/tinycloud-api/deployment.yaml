apiVersion: apps/v1
kind: Deployment
metadata:
  name: tinycloud-api
  namespace: tinycloud
  labels:
    app.kubernetes.io/name: tinycloud-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tinycloud-platform
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tinycloud-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tinycloud-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: tinycloud-platform
    spec:
      serviceAccountName: tinycloud-api
      imagePullSecrets:
        - name: ghcr-creds
      priorityClassName: platform
      containers:
        - name: api
          image: ghcr.io/sasirulk/tinycloud-platform-api:f67788cea249eb0b647e80af115bb89a96b7d32e
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: CORS_ORIGINS
              value: "https://tinycloud.sasiru.lk"
            - name: GITHUB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: github-pat
                  key: username
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-pat
                  key: token
            # In-cluster Service DNS, not the node IP 10.0.0.73 this used to
            # hardcode. The Service name and port are unchanged by the move of
            # the coordinator from a systemd unit to a pod, so this address is
            # correct both before and after that cutover: today it resolves to
            # the selector-less Service whose EndpointSlice names the node,
            # afterwards to the coordinator pod. That is why it is safe to change
            # ahead of the cutover rather than during it.
            - name: BUILD_COORDINATOR_URL
              value: "http://build-coordinator.tinycloud.svc.cluster.local:8090"
            - name: BUILD_COORDINATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: build-coordinator-token
                  key: token
            # The Oracle Cloud reads behind /v1/infra: the compartment its
            # machines, metrics and alarms live in, the network load balancer
            # the public IP comes from, and the bucket the backups go to.
            #
            # These were compiled into the image until 2026-08-27, as defaults
            # naming this tenancy. A published image that contacts the
            # maintainer's account unless told otherwise is not a platform
            # anyone else can run, so the defaults are now empty and an
            # instance names its own account here. Nothing is secret: they are
            # identifiers, and they are in the runbook and in Terraform.
            #
            # Remove a line and that read is reported as unconfigured on the
            # dashboard rather than attempted. Remove all four and core
            # contacts no cloud account at all, which is what a fresh install
            # does.
            - name: OCI_COMPARTMENT_ID
              value: "ocid1.tenancy.oc1..aaaaaaaa7xgc5ijlnvzktzftj6ho6jpzymmiira5vhug65pcvtcdy26m3ebq"
            - name: OCI_NLB_ID
              value: "ocid1.networkloadbalancer.oc1.iad.amaaaaaaul44qqiaaemwwblgkpws7pf5b2p3wetsqlyn3lhkzmls425odupq"
            - name: OCI_OBJECT_STORAGE_NAMESPACE
              value: "idzghas4xwzv"
            - name: OCI_BACKUP_BUCKET
              value: "tinycloud-backups"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
