apiVersion: apps/v1
kind: Deployment
metadata:
  name: counter-demo
  labels:
    app.kubernetes.io/name: counter-demo
    app.kubernetes.io/managed-by: tinycloud
    tinycloud.io/managed-by: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: counter-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: counter-demo
        tinycloud.io/managed-by: platform
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: counter-demo
          image: ghcr.io/sasirulk/counter-demo:12b1f816385463fc944147c64f089719cfe8f8b1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"

          # Probes check for a listening socket rather than an HTTP health path,
          # so an app needs no particular endpoint to deploy healthily.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
