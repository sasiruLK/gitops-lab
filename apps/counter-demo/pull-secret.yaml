# The image pull secret, read from OCI Vault.
#
# Replaced pull-secret-sync.yaml, which ran a PreSync hook Job to copy
# ghcr-creds out of another namespace. That took seven objects -- ServiceAccount,
# Role, RoleBinding, a NetworkPolicy opening apiserver egress, the Job and its
# hook annotations -- and gave this namespace an identity able to read Secrets
# elsewhere in the cluster, purely to duplicate one credential.
#
# creationPolicy is Orphan: the live Secret was created by that Job and is not
# tracked by Argo CD, so nothing deletes it during the switch and pods keep
# pulling throughout. It also means removing this file will not take the pull
# secret away from running workloads.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-creds
  namespace: counter-demo
  labels:
    app.kubernetes.io/name: counter-demo
    app.kubernetes.io/managed-by: tinycloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: ghcr-creds
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{ index . ".dockerconfigjson" }}'
  dataFrom:
    - extract:
        key: ghcr-creds
