apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tinycloud

resources:
  # The Namespace is deliberately not here. It is declared once, in
  # apps/tinycloud-api/namespace.yaml. Declaring it in both apps made them
  # shared owners of one object: Argo CD raised SharedResourceWarning and
  # whichever app did not hold the tracking-id sat permanently OutOfSync.
  - oauth2-proxy.yaml
  - nginx-proxy.yaml
  - ingressroute.yaml
  - ingressroute-http.yaml
  - ingressroute-apps.yaml
  - ingressroute-apps-http.yaml
  - middleware-redirect-https.yaml
  - certificate.yaml
  - network-policies.yaml
  - ingressroute-blog.yaml
  - ingressroute-build-runner.yaml

  # The build coordinator runs as a pod here, as of 2026-08-16. It was a
  # systemd unit on k3s-worker-1 reached through a selector-less Service and a
  # hand-written EndpointSlice naming 10.0.0.73; both are gone, and
  # build-coordinator-endpoint.yaml with them.
  #
  # The volume was seeded with the existing SQLite database before this line
  # was uncommitted, so the pod started with the real build history rather than
  # migrating an empty schema over it.
  - build-coordinator.yaml

configMapGenerator:
  # The sign-in and error pages oauth2-proxy serves. Generated rather than
  # written as a ConfigMap so the name gets a content hash: editing a template
  # then produces a new object name, which rolls the deployment. Without that
  # the pages change in the cluster but the running process keeps serving the
  # copies it read at startup.
  - name: oauth2-proxy-templates
    files:
      - templates/sign_in.html
      - templates/error.html
