apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tinycloud

resources:
  # The Namespace is not listed here. It belongs to apps/tinycloud-api/, which
  # has always declared it. Listing a second copy made both Applications owners
  # of the same object and they overwrote each other's labels on every sync.
  - oauth2-proxy.yaml
  - nginx-proxy.yaml
  - ingressroute.yaml
  - ingressroute-http.yaml
  - ingressroute-apps.yaml
  - ingressroute-apps-http.yaml
  - middleware-redirect-https.yaml
  - certificate.yaml
  - network-policies.yaml
  - ingressroute-blog.yaml
  - ingressroute-build-runner.yaml

  # ── Build coordinator cutover switch ──────────────────────────────────────
  #
  # The coordinator still runs as a systemd unit on k3s-worker-1, so the
  # selector-less Service and hand-written EndpointSlice below are still what
  # routes traffic to it.
  #
  # build-coordinator.yaml replaces both with a real Deployment, Service and
  # PersistentVolumeClaim. It is left out of this list on purpose: Argo CD
  # auto-syncs this path, so listing it would start the pod within minutes of a
  # push — with an empty database, while the systemd unit is still running and
  # still holds the real one. The build history would appear to vanish.
  #
  # Cutover, once the database has been copied into the volume and the systemd
  # unit stopped: swap the two lines below and delete
  # build-coordinator-endpoint.yaml. Nothing else here changes — the Service
  # keeps its name and port, so the IngressRoute above still resolves.
  - build-coordinator-endpoint.yaml
  # - build-coordinator.yaml
