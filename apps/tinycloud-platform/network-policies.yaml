apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: tinycloud
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-platform
  namespace: tinycloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: tinycloud-platform
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 4180
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-egress
  namespace: tinycloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tinycloud-api
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-to-api
  namespace: tinycloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tinycloud-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx-proxy
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-to-ui
  namespace: tinycloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tinycloud-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx-proxy
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-oauth2-to-nginx
  namespace: tinycloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nginx-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-argocd
  namespace: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tinycloud
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-solver
  namespace: tinycloud
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8089
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-oauth2-to-ui
  namespace: tinycloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tinycloud-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-egress
  namespace: tinycloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nginx-proxy
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tinycloud-api
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tinycloud-ui
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              tinycloud.io/managed-by: platform
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: tinycloud
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-oauth2-egress
  namespace: tinycloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx-proxy
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-to-platform
  namespace: tinycloud
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 4180
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui-to-api
  namespace: tinycloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tinycloud-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tinycloud-ui
      ports:
        - protocol: TCP
          port: 8080
---
# ── Build coordinator ────────────────────────────────────────────────────────
#
# These three policies select pods labelled app.kubernetes.io/name:
# build-coordinator, which do not exist yet — the coordinator is still a systemd
# unit on k3s-worker-1, reached over the node network where NetworkPolicy does
# not apply. They are inert until build-coordinator.yaml is enabled in
# kustomization.yaml, and they are here first on purpose: a pod that starts
# before its policies exist is unreachable behind the namespace's default-deny
# and every build fails while someone works out why.
#
# GitHub Actions callbacks arrive on /v1/runner/*, routed by
# ingressroute-build-runner.yaml. allow-traefik-to-platform only opens 4180 and
# 8080, so without this the coordinator's 8090 stays closed to Traefik and every
# build sits at "queued".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-build-coordinator
  namespace: tinycloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: build-coordinator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8090
---
# tinycloud-api queues builds and reads history over BUILD_COORDINATOR_URL. Its
# egress side is already allowed by allow-api-egress, which opens port 8090; this
# is the matching ingress rule on the coordinator, which had no equivalent while
# the coordinator lived off the pod network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-build-coordinator
  namespace: tinycloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: build-coordinator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tinycloud-api
      ports:
        - protocol: TCP
          port: 8090
---
# The coordinator dispatches builds by POSTing to
# api.github.com/repos/{repo}/dispatches. The namespace denies egress by default,
# so without this the dispatcher fails on every build with a connection timeout
# and jobs stay queued. DNS is already covered for all pods by
# allow-dns-egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-build-coordinator-egress
  namespace: tinycloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: build-coordinator
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443

    # The instance metadata service, for instance-principal authentication to
    # OCI Logging. It is plain HTTP on a link-local address, so the 443 rule
    # above does not cover it — without this the SDK hangs at startup trying to
    # fetch its certificate and OCI Logging silently never receives anything.
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
