apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: tinycloud
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/part-of: tinycloud-platform
    app.kubernetes.io/component: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
        app.kubernetes.io/component: auth
        app.kubernetes.io/part-of: tinycloud-platform
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          args:
            - --provider=github
            - --github-user=sasiruLK
            - --email-domain=*
            - --upstream=http://nginx-proxy:80
            - --http-address=0.0.0.0:4180
            - --redirect-url=https://tinycloud.sasiru.lk/oauth2/callback
            - --cookie-domain=sasiru.lk
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-name=_tinycloud_session
            - --whitelist-domain=.sasiru.lk
            - --reverse-proxy=true
            - --silence-ping-logging=true
            - --skip-auth-route=^/api/v1/health$
            - --set-xauthrequest=true
            # Replaces the built-in Bulma sign-in and error pages with ones
            # carrying the console's palette. See templates/ in this directory.
            #
            # A template that fails to parse stops oauth2-proxy from starting.
            # The rolling update keeps the running pod until the replacement is
            # ready, so a bad template does not lock anyone out -- but it does
            # mean a silently unchanged page is the symptom. Check the pod, not
            # the browser, if a template edit appears to do nothing.
            - --custom-templates-dir=/templates
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-github
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-github
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-github
                  key: cookie-secret
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          ports:
            - containerPort: 4180
              name: http
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 4180
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: templates
              mountPath: /templates
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      volumes:
        # Generated by configMapGenerator, so the name carries a content hash
        # and editing a template rolls the deployment. A plain ConfigMap would
        # update in place and leave the old pages served until something else
        # happened to restart the pod.
        - name: templates
          configMap:
            name: oauth2-proxy-templates
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: tinycloud
  labels:
    app.kubernetes.io/name: oauth2-proxy
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy
  ports:
    - port: 4180
      targetPort: 4180
      name: http
  type: ClusterIP
