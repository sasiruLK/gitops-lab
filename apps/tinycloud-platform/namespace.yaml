# TRANSITIONAL — this file is being handed over to apps/tinycloud-api/.
#
# The Namespace was declared in both apps. Deleting this copy outright looks
# like the obvious fix and is not: the live namespace carries
# tracking-id tinycloud-platform, and this Application syncs with prune: true.
# Removing it from the desired state therefore prunes the namespace itself,
# taking every workload in it down with it.
#
# So the handover runs in two pushes. This one makes the labels identical to
# the api copy (ending the sync-vs-sync label flapping) and marks the object
# Prune=false. Once that annotation is live, the second push can delete this
# file and Argo CD will leave the namespace alone.
apiVersion: v1
kind: Namespace
metadata:
  name: tinycloud
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/part-of: tinycloud-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
