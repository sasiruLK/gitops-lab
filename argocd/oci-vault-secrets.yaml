# The hand-made secrets, read back from OCI Vault.
#
# These four were created with kubectl and existed nowhere else until
# 2026-08-16 — no repository, no vault, no backup. A cluster rebuild restored
# every manifest and no credential. Losing oauth2-github specifically locks the
# console out with no way back in, because it is what oauth2-proxy authenticates
# against.
#
# Each Vault secret holds a base64 JSON map of {key: value}, so dataFrom.extract
# splits it back into the same keys the Secret had. Verified before these were
# written: the Secret ESO produces from Vault is byte-identical to the live one,
# so adopting them changes no data and restarts no pods.
#
# ── Why creationPolicy: Orphan, not Owner ───────────────────────────────────
#
# Owner sets an ownerReference from the Secret to the ExternalSecret, and
# Kubernetes garbage-collects a dependent when its owner goes away. That makes
# deleting an ExternalSecret — a bad rebase in this directory, a file moved by
# accident — delete the credential with it. For oauth2-github that is a console
# lockout, and the recovery path is the thing that was just deleted.
#
# Orphan still creates the Secret on a rebuild, which is the whole point, but
# leaves it standing if the ExternalSecret is removed. The blast radius of the
# safer choice is one stale Secret; of the other, no way to log in.
#
# ghcr-creds is deliberately not here. It is typed
# kubernetes.io/dockerconfigjson rather than Opaque, lives in several
# namespaces, and is emitted by the manifest generator for every app namespace —
# adopting it needs a target.template and a decision about the generator, not
# just another entry. It is backed up in Vault; wiring it is unfinished work.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oauth2-github
  namespace: tinycloud
  labels:
    app.kubernetes.io/part-of: tinycloud-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: oauth2-github
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: oauth2-github
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1beta1
