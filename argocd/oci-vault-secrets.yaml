# Shared between tinycloud-api and the build coordinator: the API sends this as
# a bearer token and the coordinator checks it. They already read the same
# Secret, so there is one value to keep in sync rather than two to drift.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: build-coordinator-token
  namespace: tinycloud
  labels:
    app.kubernetes.io/part-of: tinycloud-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: build-coordinator-token
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: build-coordinator-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# The image pull secret for the platform namespaces.
#
# App namespaces get their own copy from the manifest generator; these two are
# long-lived and declared here. argocd needs it so Image Updater can read tags
# from a private GHCR package, tinycloud so its workloads can pull at all.
#
# dockerconfigjson is a typed Secret, so unlike the others this one needs a
# template: the Vault entry is a JSON map and the type must be set explicitly or
# Kubernetes stores an Opaque Secret that imagePullSecrets silently ignores.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-creds
  namespace: tinycloud
  labels:
    app.kubernetes.io/part-of: tinycloud-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: ghcr-creds
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      # engineVersion and mergePolicy are CRD defaults. They are written out
      # because a field the API server fills in but git does not declare is a
      # diff that never closes: Argo CD reports OutOfSync forever while syncing
      # successfully every time.
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{ index . ".dockerconfigjson" }}'
  dataFrom:
    - extract:
        key: ghcr-creds
        # CRD defaults again, on the extract this time. The template block above
        # needed the same treatment; both are fields the API server fills in and
        # git has to claim, or the diff never closes.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-creds
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tinycloud-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: ghcr-creds
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      # engineVersion and mergePolicy are CRD defaults. They are written out
      # because a field the API server fills in but git does not declare is a
      # diff that never closes: Argo CD reports OutOfSync forever while syncing
      # successfully every time.
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{ index . ".dockerconfigjson" }}'
  dataFrom:
    - extract:
        key: ghcr-creds
        # CRD defaults again, on the extract this time. The template block above
        # needed the same treatment; both are fields the API server fills in and
        # git has to claim, or the diff never closes.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Shared with GitHub so a push webhook can prove it came from the repo owner.
# The coordinator verifies X-Hub-Signature-256 against this; without it the
# webhook route refuses every request rather than accepting unsigned ones.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-webhook-secret
  namespace: tinycloud
  labels:
    app.kubernetes.io/part-of: tinycloud-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: github-webhook-secret
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: github-webhook-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
