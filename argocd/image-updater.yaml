# argocd-image-updater, brought under GitOps.
#
# It has been running since 2026-07-11 but was installed by hand and existed in
# no repository, so a rebuild from the bootstrap scripts would have produced a
# cluster that silently never updated any image.
#
# Points at the upstream manifest that produced the running install: v1.2.2,
# namespace argocd, image quay.io/argoprojlabs/argocd-image-updater:v1.2.2 —
# all verified against the live deployment before adoption, so this takes
# ownership of existing resources rather than creating a second copy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tinycloud-platform
  # KNOWN BROKEN: this app reports Unknown sync status, which silently disables
  # drift detection and selfHeal.
  #
  # Argo CD v2.13.3 predates Kubernetes 1.33, so its bundled schema does not know
  # Deployment .status.terminatingReplicas. ServerSideApply's dry-run builds a
  # typed value from the live object and fails with "field not declared in
  # schema".
  #
  # ServerSideDiff=false was tried and made no difference — the failure is in the
  # apply path, not the diff feature. Removing ServerSideApply is not an option
  # either: these CRDs exceed the annotation size limit for client-side apply.
  #
  # The only real fix is upgrading Argo CD. 2.x is end of life, so that means
  # 3.x, a major version jump for the component managing everything else.
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj-labs/argocd-image-updater
    targetRevision: v1.2.2
    path: config
    directory:
      recurse: false
      include: 'install.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # Not pruned: this adopts a running controller, and a transient failure to
      # read the upstream repo should never delete the thing that keeps every
      # image current.
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
