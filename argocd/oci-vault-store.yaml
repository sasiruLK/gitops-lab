# Reads secrets from OCI Vault via instance principals.
#
# No credential is stored here: the k3s nodes authenticate to OCI as themselves,
# via the tinycloud-nodes dynamic group and the tinycloud-secrets-read policy.
# That policy grants read on secret-family only — no writes, no key management.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: oci-vault
  labels:
    app.kubernetes.io/part-of: tinycloud-platform
spec:
  provider:
    oracle:
      region: us-ashburn-1
      vault: ocid1.vault.oc1.iad.ejvibdm5aadrg.abuwcljtqerkpmgm45me5ffh7xpb374epodbrmy7qy7cerwlulwh3jtud2fa
      principalType: InstancePrincipal
---
# cert-manager's DNS01 token, now sourced from OCI Vault rather than created by
# hand during bootstrap. Verified before adoption: a temporary copy was synced to
# a separate name and hash-compared against the original, so this took ownership
# of a secret already known to hold the identical value.
#
# If ESO or the Vault API is unavailable, the existing Secret keeps working —
# refresh stops, the value does not disappear. Rotating in Vault propagates here
# within refreshInterval.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
  labels:
    app.kubernetes.io/part-of: tinycloud-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
    # Written out rather than left to the CRD's defaulting. Argo compares the
    # manifest against the live object, and every field the CRD fills in that
    # git omits reads as drift — which is what kept root permanently OutOfSync.
    # An earlier attempt to silence it with ignoreDifferences on /status missed,
    # because the difference is in .spec, not .status.
    deletionPolicy: Retain
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare-api-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
