# External Secrets Operator.
#
# Replaces the SOPS setup that never worked: .sops.yaml and the encrypted
# oauth2-github file are decorative, because nothing in this cluster can decrypt
# SOPS. Secrets are read from OCI Vault instead.
#
# Authentication uses instance principals — the k3s nodes prove their identity
# to OCI directly, so there is no bootstrap credential to store. This depends on
# the tinycloud-nodes dynamic group and the tinycloud-secrets-read policy, both
# created in OCI IAM; without them ESO authenticates as nobody and every
# ExternalSecret stays SecretSyncedError.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tinycloud-platform
  annotations:
    # Apply server-side (the CRDs here exceed the annotation size limit for
    # client-side apply) but diff client-side.
    #
    # Argo CD v2.13.3 predates Kubernetes 1.33, so its bundled schema does not
    # know Deployment .status.terminatingReplicas. Structured merge diff then
    # fails outright with "field not found in schema", leaving these apps stuck
    # reporting Unknown — which silently disables drift detection and selfHeal.
    #
    # The real fix is upgrading Argo CD, but 2.x is end of life and 3.x is a
    # major jump for the component managing everything else. This restores diffing
    # now without that risk.
    argocd.argoproj.io/compare-options: ServerSideDiff=false
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.7
    helm:
      releaseName: external-secrets
      values: |
        installCRDs: true
        # Two 6GB nodes carrying every workload. Keep the footprint small and
        # declare requests near real usage so the scheduler is not misled.
        replicaCount: 1
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            cpu: 200m
            memory: 192Mi
        webhook:
          replicaCount: 1
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 96Mi
        certController:
          replicaCount: 1
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 96Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The chart ships large CRDs that exceed the annotation size limit.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
